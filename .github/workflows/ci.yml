name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Smoke tests against the DEPLOYED site, not against this commit: the specs
  # need a live backend with real data and login credentials, so Playwright is
  # pointed at the Vercel URL instead of a locally built app.
  #
  # That makes the job unfit to gate a commit — it stays green when a PR breaks
  # something (prod is unaffected until merge) and goes red when prod is merely
  # slow or the credentials rotate. Blocking on it would put master back to
  # failing for reasons unrelated to the code, so it stays advisory.
  #
  # To make this a real gate: drop PLAYWRIGHT_SKIP_WEBSERVER/E2E_BASE_URL so the
  # webServer builds this commit, and point the app at a seeded test backend.
  # Then remove continue-on-error.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 1
          E2E_BASE_URL: https://front-end-beige-zeta.vercel.app
          # E2E_PHONE and E2E_PASSWORD are GitHub secrets; tests fall back to
          # docs creds when unset (acceptable for non-prod smoke runs).
          E2E_PHONE: ${{ secrets.E2E_PHONE }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
