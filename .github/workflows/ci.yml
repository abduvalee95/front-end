name: CI

# `master` is the production branch — it is what Vercel deploys and what the
# production domains alias to. It was missing here while `main`, which does not
# exist in this repository, was listed instead, so every push to production ran
# with no CI at all: the one branch where a gate matters most was the only one
# not covered.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # Everything here is blocking. A gate that reports and shrugs teaches people
  # to ignore it, which is worse than not having it: `lint` and the whole e2e
  # job used to carry continue-on-error, so a red check meant nothing.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Design system audit
        run: npm run design:audit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # The build only needs these to exist; nothing here reaches a real
          # service. Route handlers read them at request time.
          JWT_ACCESS_SECRET: ci-build-placeholder-secret
          API_URL: http://127.0.0.1:59999

      # Runs against a locally built app with no backend: route protection, the
      # AI action allowlist, rate limiting, the admin secret, and computed
      # contrast. These are the regression tests for real bugs, so they block.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the built app
        run: |
          nohup npm run start -- --port 3000 > /tmp/next-server.log 2>&1 &
          # Poll rather than sleep: a fixed wait either flakes on a slow runner
          # or wastes time on a fast one.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/login; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not start"; cat /tmp/next-server.log; exit 1
        env:
          JWT_ACCESS_SECRET: ci-e2e-secret-not-a-real-key
          ADMIN_SECRET: ci-e2e-admin-secret
          API_URL: http://127.0.0.1:59999

      - name: E2E (no backend required)
        run: npm run test:e2e:local
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 1
          E2E_BASE_URL: http://127.0.0.1:3000
          # Must match the value the server was started with, or every
          # signed-token case skips instead of running.
          JWT_ACCESS_SECRET: ci-e2e-secret-not-a-real-key

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Non-blocking on purpose: these drive a real login against the deployed
  # backend, so they fail for reasons that have nothing to do with the commit
  # under test — a backend deploy, expired seed credentials, a cold start.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests against the deployed app
        run: npm run test:e2e:smoke
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 1
          E2E_BASE_URL: https://front-end-beige-zeta.vercel.app
          E2E_PHONE: ${{ secrets.E2E_PHONE }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
